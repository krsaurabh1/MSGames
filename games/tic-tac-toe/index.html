<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe - M+S Games</title>
  <link rel="stylesheet" href="../../shared/styles.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="back-link" href="../../index.html">&larr; All Games</a>

  <header class="site-header">
    <h1>Tic-Tac-Toe</h1>
    <p id="turn-indicator">Take turns tapping a square. Get three in a row to win!</p>
  </header>

  <div class="game-wrap">
    <div class="top-bar">
      <div class="score-box">
        <span class="label">X Wins</span>
        <span id="score-x">0</span>
      </div>
      <div class="score-box">
        <span class="label">Draws</span>
        <span id="score-draw">0</span>
      </div>
      <div class="score-box">
        <span class="label">O Wins</span>
        <span id="score-o">0</span>
      </div>
    </div>

    <div class="top-bar">
      <button id="new-game">New Round</button>
    </div>

    <div id="board" class="board"></div>

    <div id="message" class="message hidden">
      <p id="message-text"></p>
      <button id="try-again">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
